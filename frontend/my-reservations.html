
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Reservations | MyStudySpace</title>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/rooms.css">
  <link rel="stylesheet" href="css/my-reservations.css">
</head>

<body>

  <header class="topbar">
    <span class="logo">MyStudySpace</span>

    <nav>
      <a href="index.html">Find a Room</a>
      <a href="my-reservations.html" class="active">
        My Reservations
      </a>
    </nav>
  </header>

  <main class="layout">
    <section class="panel reservations-panel">

      <h1>My Reservations</h1>

      <p>
        View and manage your upcoming study room reservations.
        You can cancel a reservation or check in when it begins.
      </p>

      <div id="reservation-message"
           role="status"
           aria-live="polite"></div>

      <div id="reservation-details">
        <p>Loading your reservations...</p>
      </div>

    </section>
  </main>

  <script src="js/my-reservations.js"></script>

</body>
</html>
