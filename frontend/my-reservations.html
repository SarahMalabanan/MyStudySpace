
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Reservations | MyStudySpace</title>

  <!-- Shared MyStudySpace styling -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/rooms.css">
  <link rel="stylesheet" href="css/my-reservations.css">
</head>

<body>

  <!--
    MyStudySpace - My Reservations

    User Story: US-08 - Check In to a Reservation
    Sprint: 1

    Displays reservation information and allows
    authenticated students to manage reservations
    and check in.

    Reservation data must come from the backend.
    No student IDs or reservations are hard-coded.
  -->

  <!-- Website navigation -->
  <header class="topbar">
    <span class="logo">MyStudySpace</span>

    <nav>
      <a href="index.html">Find a Room</a>
      <a href="my-reservations.html" class="active">
        My Reservations
      </a>
    </nav>
  </header>

  <!-- Main reservation interface -->
  <main class="layout">
    <section class="panel reservations-panel">

      <h1>My Reservations</h1>

      <p>
        View and manage your upcoming study room reservations.
        You can cancel a reservation or check in when it begins.
      </p>

      <!-- Reservation status and error messages -->
      <div
        id="reservation-message"
        role="status"
        aria-live="polite">
      </div>

      <!-- Reservation information from backend -->
      <div id="reservation-details">
        <p>Loading your reservations...</p>
      </div>

      <!--
        Check-in button remains disabled until
        an eligible reservation is loaded.
      -->
      <button
        type="button"
        class="btn"
        id="check-in-button"
        disabled>
        Check In
      </button>

      <!-- Check-in confirmation or error message -->
      <p
        id="check-in-message"
        role="status"
        aria-live="polite">
      </p>

    </section>
  </main>

  <!-- Existing reservation management controller -->
  <script src="js/my-reservations.js"></script>

  <!-- Check-in controller -->
  <script src="js/checkin.js"></script>

</body>
</html>
