
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guest Access | MyStudySpace</title>

  <!-- Use the same colors and styling as the homepage -->
  <link rel="stylesheet" href="../css/base.css">

  <style>
    /* Center the guest form on the page */
    .guest-panel {
      max-width: 520px;
      margin: 50px auto;
      padding: 30px;
    }

    .guest-panel h1 {
      margin: 0;
    }

    /* Style the guest information fields */
    .guest-panel input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
    }

    .guest-panel label {
      font-weight: 600;
      color: var(--ink);
    }

    /* Separate guest access from account registration */
    .account-option {
      text-align: center;
      border-top: 1px solid var(--line);
      margin-top: 28px;
      padding-top: 20px;
    }

    /* Keep the registration button consistent with the website */
    .account-option .btn {
      display: block;
      text-decoration: none;
    }

    .account-option p a {
      color: var(--primary);
    }
  </style>
</head>

<body>

  <!-- Main website navigation -->
  <header class="topbar">
    <span class="logo">MyStudySpace</span>

    <nav>
      <a href="../index.html">Find a Room</a>
      <a href="../my-reservations.html">My Reservations</a>
    </nav>
  </header>

  <!-- Guest access form -->
  <main class="panel guest-panel">

    <h1>Welcome to MyStudySpace</h1>
    <p>Reserve study rooms without creating an account.</p>

    <!-- Collect the guest's contact information -->
    <form id="guest-form">

      <label for="first-name">First Name</label>
      <input
        type="text"
        id="first-name"
        name="firstName"
        placeholder="Enter your first name"
        autocomplete="given-name"
        required
      >

      <label for="phone">Phone Number</label>
      <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="(201) 555-0123"
        autocomplete="tel"
        required
      >

      <button class="btn" type="submit">
        Continue as Guest
      </button>
    </form>

    <!-- Account registration is optional -->
    <div class="account-option">

      <strong>
        Want to save your preferences and reservation history?
      </strong>

      <p>
        Create an account for a more personalized experience.
      </p>

      <!-- Opens registration in the same AccountS2 folder -->
      <a href="register.html" class="btn secondary">
        Create an Account
      </a>

      <!-- Opens login in the same AccountS2 folder -->
      <p>
        Already have an account?
        <a href="login.html">Log In</a>
      </p>

    </div>
  </main>

  <script>
    /*
     * Guest Access - Sprint 2
     * Checks the guest's information and saves it
     * temporarily while they use the website.
     *
     * This does not create a verified login session.
     */

    document.getElementById('guest-form')
      .addEventListener('submit', function (event) {

        // Stop the form from refreshing the page
        event.preventDefault();

        // Get the guest's name and phone number
        const firstName = document
          .getElementById('first-name').value.trim();

        const phone = document
          .getElementById('phone').value.trim();

        // Check that both fields contain valid information
        if (!firstName || !/^\+?[\d\s().-]{10,20}$/.test(phone)) {
          alert('Please enter a valid name and phone number.');
          return;
        }

        // Save guest information for the current browser tab
        sessionStorage.setItem('guestName', firstName);
        sessionStorage.setItem('guestPhone', phone);

        // Send the guest back to the homepage
        window.location.href = '../index.html';
      });
  </script>

</body>
</html>
