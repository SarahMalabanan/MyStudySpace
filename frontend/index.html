
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find a Room | MyStudySpace</title>

  <!-- Styling for the website and study room maps -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/rooms.css">

  <style>
    /* Keep the preference link beside the search heading. */
    .filter-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .filter-heading h2 {
      margin: 0;
    }

    /* Make Apply Preferences subtle. */
    .apply-preferences {
      width: auto;
      padding: 4px 0;
      border: none;
      background: transparent;
      color: var(--primary);
      font: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .apply-preferences:hover {
      text-decoration: underline;
    }

    .apply-preferences[hidden],
    #preference-status[hidden] {
      display: none;
    }

    .apply-preferences:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 3px;
    }

    #preference-status {
      margin: 8px 0;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>

<body>

  <!-- Main navigation bar -->
  <header class="topbar">
    <span class="logo">MyStudySpace</span>

    <nav>
      <a href="index.html" class="active">
        Find a Room
      </a>

      <a href="my-reservations.html" id="reservations-link">
        My Reservations
      </a>

      <a href="admin.html" id="admin-dashboard-link" hidden>
        Admin Dashboard
      </a>
    </nav>

    <!-- Switch between library locations -->
    <select
      class="location"
      id="library"
      aria-label="Library location">
    </select>

    <!-- Guest access or account settings -->
    <a
      href="AccountS2/guest.html"
      class="btn"
      id="account-link"
      style="width:auto; margin:0; padding:8px 18px; text-decoration:none;">
      Guest Access
    </a>

    <!-- Logged-in user's initials -->
    <div class="avatar" title="Account">NT</div>
  </header>

  <!-- Main study room search layout -->
  <main class="layout three">

    <!-- Search filters -->
    <aside class="panel">

      <div class="filter-heading">
        <h2>Search filters</h2>

        <button
          type="button"
          id="apply-preferences"
          class="apply-preferences"
          hidden>
          Apply Preferences
        </button>
      </div>

      <p
        id="preference-status"
        role="status"
        aria-live="polite"
        hidden>
      </p>

      <label for="date">Date</label>
      <input type="date" id="date">

      <label for="time">Time</label>
      <select id="time"></select>

      <label for="floor">Floor</label>
      <select id="floor">
        <option value="2">Second Floor</option>
        <option value="3">Third Floor</option>
      </select>

      <!-- Room accessories -->
      <label>Accessories</label>

      <label class="check" id="row-whiteboard">
        <input type="checkbox" id="f-whiteboard">
        Whiteboard
      </label>

      <label class="check" id="row-tv">
        <input type="checkbox" id="f-tv">
        TV
      </label>

      <label class="check">
        <input type="checkbox" id="f-window">
        Window
      </label>

      <label class="check">
        <input type="checkbox" id="f-outlet">
        Outlet
      </label>

      <button
        type="button"
        class="btn"
        id="search">
        Search rooms
      </button>
    </aside>

    <!-- Interactive library floor maps -->
    <section class="panel">

      <div class="tabs" id="tabs"></div>

      <div class="map" id="map"></div>

      <div class="legend">
        <span>Available</span>
        <span class="u">Unavailable</span>
        <span class="s">Selected</span>
      </div>

    </section>

    <!-- Selected room information -->
    <aside class="panel" id="detail"></aside>

  </main>

  <!-- Existing room search scripts -->
  <script src="js/floorplans.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/rooms.js"></script>

  <script>
    // Saved filters for the currently logged-in account.
    let savedPreferences = null;

    // Read the preference cookie created in Account Settings.
    function getSavedPreferences(userId) {
      const cookieName =
        `mystudyspace_preferences_${userId}=`;

      const cookie = document.cookie.split('; ')
        .find(item => item.startsWith(cookieName));

      if (!cookie) return null;

      try {
        return JSON.parse(
          decodeURIComponent(
            cookie.slice(cookieName.length)
          )
        );
      } catch (error) {
        console.error(
          'Could not read saved preferences:',
          error
        );
        return null;
      }
    }

    // Check the current account session.
    async function checkAccount() {
      try {
        const response = await fetch(
          '/api/accounts/recognizeduser',
          {
            credentials: 'same-origin',
            cache: 'no-store'
          }
        );

        if (!response.ok) return;

        const user = await response.json();

        const accountLink =
          document.getElementById('account-link');

        const reservationsLink =
          document.getElementById('reservations-link');

        const adminLink =
          document.getElementById('admin-dashboard-link');

        // Staff account navigation.
        if (user.role === 'staff') {
          adminLink.hidden = false;
          reservationsLink.hidden = true;

          accountLink.textContent = 'Account Settings';
          accountLink.href = 'AccountS2/settings.html';

        } else {
          // Regular student account navigation.
          adminLink.hidden = true;
          reservationsLink.hidden = false;

          accountLink.textContent = 'Account Settings';
          accountLink.href = 'AccountS2/settings.html';
        }

        // Display the user's initials.
        const initials =
          (user.first_name?.[0] || '') +
          (user.last_name?.[0] || '');

        if (initials) {
          document.querySelector('.avatar').textContent =
            initials.toUpperCase();
        }

        // Load saved preferences for this account.
        savedPreferences =
          getSavedPreferences(user.user_id);

        document.getElementById(
          'apply-preferences'
        ).hidden = !savedPreferences;

      } catch (error) {
        console.error(
          'Could not check account session:',
          error
        );
      }
    }

    // Find a matching time in the dropdown.
    function findPreferredTime(select, savedTime) {
      const hour = Number(savedTime);

      return [...select.options].find(option => {
        const value = option.value.trim();
        const label = option.textContent.trim();

        if (value === String(savedTime)) {
          return true;
        }

        const match = label.match(
          /^(\d{1,2}):00\s*(AM|PM)/i
        );

        if (!match) return false;

        let optionHour =
          Number(match[1]) % 12;

        if (match[2].toUpperCase() === 'PM') {
          optionHour += 12;
        }

        return optionHour === hour;
      });
    }

    // Apply saved account preferences.
    function applyPreferences() {
      if (!savedPreferences) return;

      const floorSelect =
        document.getElementById('floor');

      // Apply preferred floor if it exists.
      if (savedPreferences.floor) {
        const floorExists = [
          ...floorSelect.options
        ].some(
          option =>
            option.value ===
            String(savedPreferences.floor)
        );

        if (floorExists) {
          floorSelect.value =
            String(savedPreferences.floor);

          floorSelect.dispatchEvent(
            new Event('change', {
              bubbles: true
            })
          );
        }
      }

      // Apply preferred time.
      const timeSelect =
        document.getElementById('time');

      if (savedPreferences.time != null) {
        const matchingOption =
          findPreferredTime(
            timeSelect,
            savedPreferences.time
          );

        if (matchingOption) {
          timeSelect.value =
            matchingOption.value;

          timeSelect.dispatchEvent(
            new Event('change', {
              bubbles: true
            })
          );
        }
      }

      // Apply accessory preferences.
      const accessories =
        savedPreferences.accessories || {};

      [
        'whiteboard',
        'tv',
        'window',
        'outlet'
      ].forEach(item => {
        const checkbox =
          document.getElementById('f-' + item);

        if (checkbox) {
          checkbox.checked =
            Boolean(accessories[item]);

          checkbox.dispatchEvent(
            new Event('change', {
              bubbles: true
            })
          );
        }
      });

      // Apply the selected filters to the room results.
      document.getElementById('search').click();

      const status =
        document.getElementById('preference-status');

      status.textContent =
        'Saved preferences applied.';

      status.hidden = false;
    }

    document.getElementById('apply-preferences')
      .addEventListener('click', applyPreferences);

    checkAccount();
  </script>

</body>
</html>
